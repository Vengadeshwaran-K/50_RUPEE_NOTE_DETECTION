[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rupeevision"
version = "1.0.0"
description = "Indian ₹50 banknote detection with YOLOv8 ONNX, OpenCV and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
onnx = ["onnx>=1.14"]
runtime = ["onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
rupeevision-webcam = "rupeevision.webcam:main"

[tool.setuptools.packages.find]
include = ["rupeevision*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
